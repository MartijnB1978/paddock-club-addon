{% extends "base.html" %}
{% block main %}
<section class="card narrow">
  <h1>Sign in</h1>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
    <label>Name or e-mail<input name="name" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">Sign in</button>
  </form>
  <p class="muted"><a href="/forgot">Forgot your password?</a></p>
</section>
{% endblock %}
